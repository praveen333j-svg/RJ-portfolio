site_name: "Ranga Jayasinghe"
site_description: "Enterprise Transformation Leader | Banking, Cards & Payments"
site_author: "Ranga Jayasinghe"

theme:
  name: "material"
  palette:
    - scheme: "slate"
      primary: "teal"
      accent: "teal"
  font:
    text: "Inter"
    code: "Roboto Mono"
  features:
