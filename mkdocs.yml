    - "navigation.sections"
    - "toc.integrate"

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html

nav:
  - "Home": "index.md"
  - "Value Proposition": "value-proposition.md"
  - "Leadership": "leadership.md"
  - "Experience & Delivery": "experience.md"
  - "Executive Playbooks":
    - "The Cutover Playbook": "playbooks/cutover-strategy.md"